<style>

    :root { --bg: #131318; --card: #1c1c24; --ink: #ececf2; --muted: #9a9aaa; --line: #2e2e3a;
      --accent: #a98bff; --accent-ink: #131318; --win: #3ecf8e; --warn: #f5a524; --bad: #ff6b8b; }

  * { box-sizing: border-box; }

    font: 15px/1.6 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }

  /* Tabs */

  .nav-tab-btn { background: none; border: none; font: inherit; font-size: 15px; font-weight: 600; color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }

  .nav-tab-btn[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); }
  .nav-tab-btn:focus-visible, .btn:focus-visible, .lens button:focus-visible, .claim-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .verdict { border-left: 4px solid var(--win); }
  .verdict .big { font-size: 26px; font-weight: 700; color: var(--win); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--muted); margin-left: 6px; }
  .badge.win { background: var(--win); color: var(--accent-ink); border-color: var(--win); }
  .badge.warn { background: var(--warn); color: var(--accent-ink); border-color: var(--warn); }

  .bars > div { display: grid; grid-template-columns: 140px 1fr 56px; gap: 10px; align-items: center; margin: 6px 0; }
  .bar { height: 12px; border-radius: 6px; background: var(--line); overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 560px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: center; }
  th:first-child, td:first-child { text-align: left; min-width: 220px; }
  td.cell { cursor: help; font-variant-numeric: tabular-nums; font-weight: 600; }
  td.cell.hot::after { content: " 🔥"; font-size: 11px; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--line); }
  td.winner, th.winner { color: var(--win); }
  .crit-name { display: block; font-weight: 600; }
  .crit-w { color: var(--muted); font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .lens button, .btn { font: inherit; padding: 4px 12px; margin: 0 6px 6px 0; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
  .lens button[aria-pressed=true] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .prewrap { white-space: pre-wrap; }
  input[type=search], select { background: var(--card); color: var(--ink); }
  ul { margin: 6px 0; padding-left: 20px; }
  li { margin: 4px 0; }
  .sev-high { color: var(--bad); font-weight: 600; } .sev-medium { color: var(--warn); font-weight: 600; } .sev-low { color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .muted { color: var(--muted); }
  .quote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); margin: 6px 0; font-style: italic; }

  /* Replay Player */
  .replay-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .replay-box { min-height: 180px; padding: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; }
  .speaker-badge { font-weight: bold; color: var(--accent); margin-bottom: 6px; }

  /* Claim Graph */
  .claims-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .claim-item { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
  .claim-item:hover, .claim-item.selected { border-color: var(--accent); }
  .claim-item.target-highlight { border-color: var(--bad); background: rgba(192, 38, 75, 0.08); }

  @media (max-width: 560px) { .bars > div { grid-template-columns: 90px 1fr 48px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

sted_open_llm\"],\"attacks\":[\"sec.1\"]}]\n```","claims":["cto.1"],"attacks":["sec.1"],"concessions":[],"acknowledgements":[],"timestamp":"2026-11-03T14:58:26.580Z"},{"id":"turn_kiss_hacker_opening_4","type":"debater","speaker":"kiss_hacker","kind":"opening","round":null,"text":"我選擇最務實的方案 cloud_api_with_anonymization。在 1,500 RPS 與 3 人小團隊約束下，任何沒有算過帳的過度架構都是工程師的自嗨。最少活動零件原則才是真理。","full_text":"我選擇最務實的方案 cloud_api_with_anonymization。在 1,500 RPS 與 3 人小團隊約束下，任何沒有算過帳的過度架構都是工程師的自嗨。最少活動零件原則才是真理。\n\n```claims\n[{\"text\":\"現有負載下簡約架構完全足夠支撐，不要為不存在的規模做設計\",\"quote\":\"不要為不存在的規模做設計\",\"kind\":\"proposal\",\"supports\":[\"cloud_api_with_anonymization\"]}]\n```","claims":["kiss.1"],"attacks":[],"concessions":[],"acknowledgements":[],"timestamp":"2026-11-03T14:58:26.580Z"},{"id":"chair_directive_1","type":"chair","kind":"directive","round":1,"text":"戰況總結：交鋒焦點聚焦於即時交付 vs 長期擴展性。請各辯手針對具體量級數據展開正面質詢！@conservative_cto，請說明如果流量在 1 年內達到 5,000 QPS，成本相差多少？","timestamp":"2026-11-03T14:58:26.580Z"},{"id":"factcheck_1","type":"factcheck","kind":"factcheck","round":1,"text":"- ✅ #sec.1 plausible：架構複雜度與交付週期成正比","timestamp":"2026-11-03T14:58:26.580Z"},{"id":"turn_conservative_cto_rebuttal_1","type":"debater","speaker":"conservative_cto","kind":"rebuttal","round":1,"text":"> 【security_paranoid #sec.1】降低初創期總持有成本與風險\n【讓步 #cto.1】我承認在業務初期首年，3 人團隊生存交付確實排在第一位。但是若延遲突破 50ms，我們必須看清長期技術債的複利效應。","full_text":"> 【security_paranoid #sec.1】降低初創期總持有成本與風險\n【讓步 #cto.1】我承認在業務初期首年，3 人團隊生存交付確實排在第一位。但是若延遲突破 50ms，我們必須看清長期技術債的複利效應。\n\n```claims\n[{\"text\":\"預先做好領域邊界規劃可兼顧當期速度與未來遷移\",\"quote\":\"預先做好領域邊界規劃\",\"kind\":\"proposal\",\"supports\":[\"cloud_api_with_anonymization\"],\"concedes\":[\"cto.1\"]}]\n```","claims":["cto.2"],"attacks":["sec.1"],"concessions":["cto.1"],"acknowledgements":[],"timestamp":"2026-11-03T14:58:26.581Z"},{"id":"turn_security_paranoid_rebuttal_1","type":"debater","speaker":"security_paranoid","kind":"rebuttal","round":1,"text":"> 【conservative_cto #cto.1】長期擴展性具備不可替代優勢。\n若公司在第 1 年就因過早最佳化把 300 萬資金燒光，五年 "conceded_in":"turn_conservative_cto_rebuttal_1"},"kiss.1":{"id":"kiss.1","speaker":"kiss_hacker","turn_kind":"opening","round":null,"text":"現有負載下簡約架構完全足夠支撐，不要為不存在的規模做設計","quote":"不要為不存在的規模做設計","kind":"proposal","supports_option_ids":["cloud_api_with_anonymization"],"attacks_claim_ids":[],"attacks_on_settled":[],"concedes_claim_ids":[],"status":"open","attacked_by":[],"acknowledged_by":[],"fact_check":null},"cto.2":{"id":"cto.2","speaker":"conservative_cto","turn_kind":"rebuttal","round":1,"text":"預先做好領域邊界規劃可兼顧當期速度與未來遷移","quote":"預先做好領域邊界規劃","kind":"proposal","supports_option_ids":["cloud_api_with_anonymization"],"attacks_claim_ids":["sec.1"],"attacks_on_settled":[],"concedes_claim_ids":["cto.1"],"status":"open","attacked_by":[],"acknowledged_by":[],"fact_check":null},"sec.3":{"id":"sec.3","speaker":"security_paranoid","turn_kind":"rebuttal","round":1,"text":"新創團隊的第一法則是活到下一個季度","quote":"活到下一個季度","kind":"value","supports_option_ids":["cloud_api_with_anonymization"],"attacks_claim_ids":["cto.1"],"attacks_on_settled":["cto.1"],"concedes_claim_ids":[],"status":"open","attacked_by":[],"acknowledged_by":[],"fact_check":null},"kiss.2":{"id":"kiss.2","speaker":"kiss_hacker","turn_kind":"rebuttal","round":1,"text":"遵循奧卡姆剃刀，先用最小可行方案上線驗證反饋","quote":"先用最小可行方案上線驗證反饋","kind":"proposal","supports_option_ids":["cloud_api_with_anonymization"],"attacks_claim_ids":["cto.1"],"attacks_on_settled":["cto.1"],"concedes_claim_ids":[],"status":"open","attacked_by":[],"acknowledged_by":[],"fact_check":null}},"transcript":"# 完整辯論逐字稿：客服對話摘要功能（每日 5 萬次呼叫、含敏感客戶個資）：該自架開源 LLM 還是使用雲端商業 API？\n\n> 建立時間：2026-11-03T14:58:26.580Z\n\n## 決策簡報與情境約束\n\n- **問題**：客服對話摘要功能（每日 5 萬次呼叫、含敏感客戶個資）：該自架開源 LLM 還是使用雲端商業 API？\n- **候選方案**：`cloud_api_with_anonymization` (雲端商業 API + 本地去識別化前置代理)、`self_hosted_open_llm` (自架開源私有化 LLM (vLLM))\n- **情境事實**：\n  - 客服系統每日處理 5 萬通客服對話，內含電話、地址與信用卡後四碼\n  - 符合金融法規要求，若使用雲端 API 需做去識別化；若自架開源模型則需自購 GPU 伺服器並負擔高昂電費與維運\n- **預設假設**：\n  - 業務優先活下來並驗證 PMF\n- **評估準則**：`regulatory_compliance` 個資法法規合規與審計安全性、`summary_quality` 長文本對話摘要品質與精準度、`tco_infrastructure` 基礎設施三年總持有成本 (TCO)、`ops_simplicity` 維運簡單度與 SLA 保證、`scalability_concurrency` 尖峰流量彈性伸縮、`vendor_lockin` 供應商鎖定防範\n\n---\n\n## 辯論完整進程\n\n### ⚖️ 天秤主席 ｜ 開場陳述\n\n歡迎各位蒞臨 Agent Senate 虛擬內閣。今天議事日程為【客服對話摘要功能隱私與個資選型】。請各位辯手就座，開門見山亮出立場與量級依據！\n\n---\n\n### 🔐 資安官 ｜ 開場陳述\n\n我堅決推薦選擇 雲端商業 API + 本地去識別化前置代理（cloud_api_with_anonymization）。理由在於團隊需要極致控制風險與交付成本。\n\n> 提出論點：`#sec.1`, `#sec.2`\n\n---\n\n### 🛡️ 陳CTO ｜ 開場陳述\n\n我支持 自架開源私有化 LLM (vLLM)（self_hosted_open_llm）。\n> 【security_paranoid #sec.1】降低初創期總持有成本與風險。但是如果長期架構擴展性與極限性能有硬傷，後續重構代價將是 5 倍以上。\n\n> 提出論點：`#cto.1` ｜ ⚔️ 攻擊：`#sec.1`\n\n---\n\n### 🪓 剃刀 ｜ 開場陳述\n\n我選擇最務實的方案 cloud_api_with_anonymization。在 1,500 RPS 與 3 人小團隊約束下，任何沒有算過帳的過度架構都是工程師的自嗨。最少活動零件原則才是真理。\n\n> 提出論點：`#kiss.1`\n\n---\n\n### ⚖️ 天秤主席 ｜ 主席指令（第 1 輪）\n\n戰況總結：交鋒焦點聚焦於即時交付 vs 長期擴展性。請各辯手針對具體量級數據展開正面質詢！@conservative_cto，請說明如果流量在 1 年內達到 5,000 QPS，成本相差多少？\n\n---\n\n### 🔎 事實查核（第 1 輪）\n\n- ✅ #sec.1 plausible：架構複雜度與交付週期成正比\n\n---\n\n### 🛡️ 陳CTO ｜ 交叉質詢（第 1 輪）\n\n> 【security_paranoid #sec.1】降低初創期總持有成本與風險\n【讓步 #cto.1】我承認在業務初期首年，3 人團隊生存交付確實排在第一位。但是若延遲突破 50ms，我們必須看清長期技術債的複利效應。\n\n> 提出論點：`#cto.2` ｜ ⚔️ 攻擊：`#sec.1` ｜ 💔 讓步：`#cto.1`\n\n---\n\n### 🔐 資安官 ｜ 交叉質詢（第 1 輪）\n\n> 【conservative_cto #cto.1】長期擴展性具備不可替代優勢。\n若公司在第 1 年就因過早最佳化把 300 萬資金燒光，五年後的擴展性只是幻影。新創團隊的第一法則是活到下一個季度。\n\n> 提出論點：`#sec.3` ｜ ⚔️ 攻擊：`#cto.1`\n\n---\n\n### 🪓 剃刀 ｜ 交叉質詢（第 1 輪）\n\n> 【conservative_cto #cto.1】預先做好領域邊界規劃\n把它刪掉，看看誰會哭？在單台 4 核心 8GB 伺服器上，把不必要的 10 個微服務活動零件全數剃除。\n\n> 提出論點：`#kiss.2` ｜ ⚔️ 攻擊：`#cto.1`\n\n---\n\n### ⚖️ 天秤主席 ｜ 主席指令（第 2 輪）\n\n第 2 輪：@security_paranoid，若 1 年內團隊擴到 10 人，你的方案上手要幾週？@conservative_cto，重構成本 5 倍的推算過程是什麼？@kiss_hacker，單機撐不住的量級是多少？\n\n---\n\n### 🔐 資安官 ｜ 交叉質詢（第 2 輪）\n\n> 【conservative_cto #cto.2】預先做好領域邊界規劃\n10 人團隊新人上手約 2 週（估：照現有 onboarding 文件與 code review 節奏推算）。邊界規劃可以，但不需要先付分散式的稅。\n\n> ⚔️ 攻擊：`#cto.2`\n\n---\n\n### 🛡️ 陳CTO ｜ 交叉質詢（第 2 輪）\n\n> 【security_paranoid #sec.3】活到下一個季度\n活到下個季度之後還要活第 8 個季度。重構 5 倍是以「事後拆分 vs 事前劃界」的人月比估的。\n\n> ⚔️ 攻擊：`#sec.3`\n\n---\n\n### 🪓 剃刀 ｜ 交叉質詢（第 2 輪）\n\n單機 4 核 8GB 在讀多寫少的 B2B 情境下撐到數千 RPS（估），真的撐不住時再加一台。\n\n---\n\n### 🔐 資安官 ｜ 鋼人論證\n\n我為 self_hosted_open_llm 做最強辯護：如果未來流量出現 10 倍指數級增長，當初奠定的硬核架構將展現巨大的免重構優勢。這動搖了我 25%。\n\n---\n\n### 🛡️ 陳CTO ｜ 鋼人論證\n\n我為 cloud_api_with_anonymization 做最強辯護：在商業市場上，交付速度就是生命線，新人快速接盤是抗風險護城河。這動搖了我 35%。\n\n---\n\n### 🪓 剃刀 ｜ 鋼人論證\n\n我承認對手在極限可靠性上的深刻思考，這促使我認識到簡約架構依然必須保留清晰的模組邊界。\n\n---\n\n### 🔐 資安官 ｜ 結辯\n\n結辯：我最終堅定推薦 cloud_api_with_anonymization。若團隊全員本已精通次選技術且預算無限，我的建議為錯。\n\n---\n\n### 🛡️ 陳CTO ｜ 結辯\n\n結辯：我維持對底層擴展性的警示，但尊重團隊當前的交付邊界。若業務本質為低頻系統，cloud_api_with_anonymization 是務實選擇。\n\n---\n\n### 🪓 剃刀 ｜ 結辯\n\n結辯：我堅定推薦 cloud_api_with_anonymization。先交付業務價值，再針對真實瓶頸優化。\n\n---\n\n## 最終論點索引表\n\n- sec.1 (estimate, security_paranoid) [⚔️被攻擊] (⚔️來自: cto.1, cto.2) 雲端商業 API + 本地去識別化前置代理可顯著降低初創期總持有成本與風險 ／ 原文：「降低初創期總持有成本與風險」\n- sec.2 (fact, security_paranoid) [⏳開放] 基礎設施複雜度會拖慢團隊核心業務推進 ／ 原文：「拖慢團隊核心業務推進」\n- cto.1 (value, conservative_cto) [💔已讓步] (⚔️來自: sec.3, kiss.2) 自架開源私有化 LLM (vLLM)在長期擴展性與底層控制力具備不可替代優勢 ／ 原文：「長期擴展性具備不可替代優勢」\n- kiss.1 (proposal, kiss_hacker) [⏳開放] 現有負載下簡約架構完全足夠支撐，不要為不存在的規模做設計 ／ 原文：「不要為不存在的規模做設計」\n- cto.2 (proposal, conservative_cto) [⏳開放] 預先做好領域邊界規劃可兼顧當期速度與未來遷移 ／ 原文：「預先做好領域邊界規劃」\n- sec.3 (value, security_paranoid) [⏳開放] 新創團隊的第一法則是活到下一個季度 ／ 原文：「活到下一個季度」\n- kiss.2 (proposal, kiss_hacker) [⏳開放] 遵循奧卡姆剃刀，先用最小可行方案上線驗證反饋 ／ 原文：「先用最小可行方案上線驗證反饋」\n\n## 辯手計分板\n\n| 辯手 | 論點數 | 攻擊命中 | 主動讓步 | 被標謬誤 | 查核標記 | MVP得分 |\n|---|---:|---:|---:|---:|---:|---:|\n| 🔐 資安官 | 3 | 0 | 0 | 0 | 0 | **0** |\n| 🛡️ 陳CTO | 2 | 0 | 1 | 0 | 0 | **1** |\n| 🪓 剃刀 | 2 | 0 | 0 | 0 | 0 | **0** |"}}</script>

  // ==========================================
  var transText = X.transcript || DATA.transcript || "";
  var searchInput = h("input", { type: "search", "aria-label": "搜尋逐字稿", placeholder: "搜尋逐字稿關鍵字…", style: "width: 100%; padding: 8px; margin-bottom: 12px; border-radius: 6px; border: 1px solid var(--line);" });
  var transBody = h("div", { style: "white-space: pre-wrap; font-family: monospace; font-size: 13px; line-height: 1.6; max-height: 600px; overflow-y: auto;" }, transText || "未提供純文字逐字稿。");

  searchInput.oninput = function (e) {
    var kw = e.target.value.trim().toLowerCase();
    if (!kw) {
      transBody.textContent = transText;
      return;
    }
    var lines = transText.split("\n");
    var matched = lines.filter(function (l) { return l.toLowerCase().indexOf(kw) !== -1; });
    transBody.textContent = matched.length ? matched.join("\n") : "無相符結果。";
  };

  tabTranscript.appendChild(h("div", { class: "card" },
    h("h2", null, "📜 完整辯論逐字稿"),
    searchInput,
    transBody
  ));

  var defaultTab = document.body.getAttribute("data-active-tab") || "matrix";
  if (["matrix", "replay", "claims", "transcript"].indexOf(defaultTab) !== -1) {
    switchTab(defaultTab);
  }
})();
</script>
</body>
</html>
