# Opt-in Agent Senate filesystem Skill provider for DeepSeek Harness.
# Resolves the packaged Skill root from the installed npm identity anchored at
# the DSH profile (Loader baseUrl), never as a path concatenated onto baseUrl.
- insert:
    - id: agent-senate-skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: agent-senate-plugin
        includeDefaultRoots: false
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('agent-senate-dsh/package.json')), 'skills')
